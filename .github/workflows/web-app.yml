# Build the Label Lab web app from ONE NAMED release tag for GitHub Pages at
# /art-files/app/, and upload dist/ as the `web-app` artifact. The tag is
# explicit (blank = label-lab-v<package.json version> on the calling ref), so
# the web app always matches a published desktop release.
# Called by release.yml and update-feed.yml, which deploy it next to the update
# feed. The feed must still publish if this build fails: a broken web build
# must never stop installed apps from updating.
name: Build web app

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (e.g. label-lab-v0.1.104). Blank = label-lab-v<package.json version>.
        type: string
        required: false
        default: ''

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history brings every tag down while checkout still holds the
      # token; with persist-credentials off, a later `git fetch` of the
      # private repo would have no credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-label-lab-v$(node -p 'require("./package.json").version')}"
          if [[ ! "$tag" =~ ^label-lab-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a label-lab release tag: $tag" >&2
            exit 1
          fi
          echo "Building the web app from $tag"
          git checkout "$tag"

      # After the tag checkout, so the Node pin and lockfile are the tag's.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build -- --base=/art-files/app/

      - uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: dist
          if-no-files-found: error
