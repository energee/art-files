name: Release Label Lab

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs (Dependabot bumps them):
# the release job holds the updater signing key, so a moved tag must not
# be able to run new code there (#393).
permissions:
  contents: write

concurrency:
  group: label-lab-release
  cancel-in-progress: false

jobs:
  # `paths: package.json` also fires on dependency-only edits (Dependabot,
  # a new devDependency), and those runs failed the version check on every
  # leg (#248). Release only a version with no label-lab-v tag yet — the same
  # signal the Validate step uses. A manual dispatch always releases (the
  # recovery path if a partial release already tagged this version).
  version:
    name: Version unreleased?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unreleased: ${{ steps.check.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          tag="label-lab-v$(jq -r .version package.json)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] ||
             ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            unreleased=true
          else
            unreleased=false
          fi
          echo "$tag unreleased=$unreleased"
          echo "unreleased=$unreleased" >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # ubuntu-24.04's glibc 2.39 sets the AppImage's floor — fine for the
          # supported Debian 13 (glibc 2.41), too new for e.g. Ubuntu 22.04.
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate version and release notes
        shell: bash
        # The newest release tag NOT on this commit. tauri-action tags HEAD as
        # soon as the first platform finishes, so on a re-run of a failed leg
        # the newest tag is this release's own, and "not newer than itself"
        # aborted the re-run (#106). `--no-contains HEAD` skips it while still
        # listing every earlier release (they are ancestors of HEAD).
        run: |
          previous_tag=$(git tag --list 'label-lab-v*' --no-contains HEAD --sort=-v:refname | head -n 1)
          if [[ -z "$previous_tag" ]]; then
            echo "No previous label-lab release tag found" >&2
            exit 1
          fi
          node scripts/check-release.mjs --release "$previous_tag"

      - name: Read changelog release notes
        id: release-notes
        run: node scripts/release-notes.mjs --github-output

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          # Match the last successful release; upgrade deliberately to preserve caches.
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure signed updater
        run: npm run desktop:release-config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

      - name: Build and publish GitHub release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into updater_enabled(); the value is public, but keeping
          # all three key settings together makes release setup less error-prone.
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          tagName: label-lab-v__VERSION__
          releaseName: Label Lab v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          # Each leg read-modify-wrote the release's shared latest.json, and
          # concurrent legs dropped each other's platforms (0.1.98 shipped
          # without macOS). publish-update-feed builds the feed instead.
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.generated.conf.json -- --timings

      - name: Upload Rust build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.target }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  # The repo is private, so installed apps cannot read its release assets.
  # Copy just the update feed (latest.json + updater archives + signatures) to
  # the public GitHub Pages site; DMGs for manual install stay on the private
  # release page. On Windows/Linux the updater artifact IS the installer
  # (-setup.exe / .AppImage), so those land on Pages too — acceptable, since
  # the whole feed is already reachable only by the unguessable site URL.
  #
  # It runs even when a platform failed (#106): one failed leg used to skip the
  # feed for every platform. scripts/build-update-feed.sh lists only the
  # platforms that uploaded, so the others keep their current version until
  # "Re-run failed jobs" rebuilds the failed leg — which re-runs this job
  # too, since it depends on it. `!cancelled()` still stops it for a
  # cancelled run.
  publish-update-feed:
    name: Publish update feed to Pages
    needs: [version, release]
    # A skipped release is not "cancelled", so gate on the version too.
    if: ${{ !cancelled() && needs.version.outputs.unreleased == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts/build-update-feed.sh
          sparse-checkout-cone-mode: false

      - name: Download updater assets from the release
        env:
          GH_TOKEN: ${{ github.token }}
        # By THIS run's tag, not "the latest release": now that the job runs
        # after a failed leg, a run whose every leg failed before publishing
        # must fail here rather than re-publish the previous release's feed.
        # (A release with no updater archives fails in the build step below.)
        run: |
          mkdir site
          tag="label-lab-v$(node -p 'require("./package.json").version')"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir site \
            --pattern '*.app.tar.gz' \
            --pattern '*.app.tar.gz.sig' \
            --pattern '*.AppImage' \
            --pattern '*.AppImage.sig' \
            --pattern '*-setup.exe' \
            --pattern '*-setup.exe.sig'

      - name: Build latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-update-feed.sh site "label-lab-v$(node -p 'require("./package.json").version')"

      # Named per attempt: a re-run still sees the earlier attempt's
      # artifact, and deploy-pages refuses two with the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
