name: Release Label Lab

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: label-lab-release
  cancel-in-progress: false

jobs:
  release:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
          - arch: Intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure signed updater
        run: npm run desktop:release-config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

      - name: Build and publish GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          # Releases publish to the public energee/label-lab-releases repo (this
          # repo is private, so its own release assets 404 for the installed
          # app's updater). RELEASES_TOKEN is a fine-grained PAT with
          # contents:write on that repo — the default GITHUB_TOKEN cannot write
          # across repos.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into updater_enabled(); the value is public, but keeping
          # all three key settings together makes release setup less error-prone.
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          owner: energee
          repo: label-lab-releases
          tagName: label-lab-v__VERSION__
          releaseName: Label Lab v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.generated.conf.json
