name: Release Label Lab

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: label-lab-release
  cancel-in-progress: false

jobs:
  release:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
          - arch: Intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure signed updater
        run: npm run desktop:release-config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

      - name: Build and publish GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into updater_enabled(); the value is public, but keeping
          # all three key settings together makes release setup less error-prone.
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          tagName: label-lab-v__VERSION__
          releaseName: Label Lab v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.generated.conf.json

  # The repo is private, so installed apps cannot read its release assets.
  # Copy just the update feed (latest.json + updater archives + signatures) to
  # the public GitHub Pages site; DMGs for manual install stay on the private
  # release page.
  publish-update-feed:
    name: Publish update feed to Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download updater assets from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download --repo "$GITHUB_REPOSITORY" --dir site \
            --pattern 'latest.json' \
            --pattern '*.app.tar.gz' \
            --pattern '*.app.tar.gz.sig'

      - name: Point latest.json at the Pages copies
        # The release's own URLs are API asset ids (the repo is private), so
        # rebuild each platform URL from the downloaded archive's filename.
        run: |
          aarch64=$(basename site/*_aarch64.app.tar.gz)
          x64=$(basename site/*_x64.app.tar.gz)
          jq --arg aarch64 "$aarch64" --arg x64 "$x64" \
            '.platforms |= with_entries(.value.url = ("https://energ.ee/art-files/" +
              (if .key | startswith("darwin-aarch64") then $aarch64 else $x64 end)))' \
            site/latest.json > site/latest.json.tmp
          mv site/latest.json.tmp site/latest.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
