name: Release Label Lab

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: label-lab-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # ubuntu-24.04's glibc 2.39 sets the AppImage's floor — fine for the
          # supported Debian 13 (glibc 2.41), too new for e.g. Ubuntu 22.04.
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Validate version and release notes
        shell: bash
        run: |
          previous_tag=$(git tag --list 'label-lab-v*' --sort=-v:refname | head -n 1)
          if [[ -z "$previous_tag" ]]; then
            echo "No previous label-lab release tag found" >&2
            exit 1
          fi
          node scripts/check-release.mjs --release "$previous_tag"

      - name: Read changelog release notes
        id: release-notes
        run: node scripts/release-notes.mjs --github-output

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          # Match the last successful release; upgrade deliberately to preserve caches.
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure signed updater
        run: npm run desktop:release-config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

      - name: Build and publish GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into updater_enabled(); the value is public, but keeping
          # all three key settings together makes release setup less error-prone.
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          tagName: label-lab-v__VERSION__
          releaseName: Label Lab v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.generated.conf.json -- --timings

      - name: Upload Rust build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.target }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  # The repo is private, so installed apps cannot read its release assets.
  # Copy just the update feed (latest.json + updater archives + signatures) to
  # the public GitHub Pages site; DMGs for manual install stay on the private
  # release page. On Windows/Linux the updater artifact IS the installer
  # (-setup.exe / .AppImage), so those land on Pages too — acceptable, since
  # the whole feed is already reachable only by the unguessable site URL.
  publish-update-feed:
    name: Publish update feed to Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download updater assets from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download --repo "$GITHUB_REPOSITORY" --dir site \
            --pattern 'latest.json' \
            --pattern '*.app.tar.gz' \
            --pattern '*.app.tar.gz.sig' \
            --pattern '*.AppImage' \
            --pattern '*.AppImage.sig' \
            --pattern '*-setup.exe' \
            --pattern '*-setup.exe.sig'

      - name: Point latest.json at the Pages copies
        # The release's own URLs are API asset ids (the repo is private), so
        # rebuild each platform URL from the downloaded archive's filename.
        run: |
          aarch64=$(basename site/*_aarch64.app.tar.gz)
          x64=$(basename site/*_x64.app.tar.gz)
          appimage=$(basename site/*.AppImage)
          nsis=$(basename site/*-setup.exe)
          # Tauri emits each platform twice: the bare key and a
          # bundle-suffixed alias (darwin-x86_64 AND darwin-x86_64-app,
          # linux-x86_64-appimage, windows-x86_64-nsis). Both must map, and
          # the error() stays so a future new key fails loudly here instead
          # of shipping a feed with a broken URL.
          jq --arg aarch64 "$aarch64" --arg x64 "$x64" \
             --arg appimage "$appimage" --arg nsis "$nsis" \
            '.platforms |= with_entries(.value.url = ("https://energ.ee/art-files/" +
              ({ "darwin-aarch64": $aarch64, "darwin-aarch64-app": $aarch64,
                 "darwin-x86_64": $x64, "darwin-x86_64-app": $x64,
                 "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage,
                 "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis
               }[.key] // error("no artifact mapped for platform " + .key))))' \
            site/latest.json > site/latest.json.tmp
          mv site/latest.json.tmp site/latest.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
