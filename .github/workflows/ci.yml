# ci.yml — frontend and desktop tests on every PR and push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# New PR revisions supersede older test runs; main runs keep their own group.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # poppler's pdftoppm rasterizes the PDF goldens (scripts/golden-diff.mts).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml
