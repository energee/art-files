# ci.yml — frontend and desktop tests on every PR and push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# New PR revisions supersede older test runs; main runs keep their own group.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # poppler's pdftoppm rasterizes the PDF goldens (scripts/golden-diff.mts).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Dead code: unused files, exports and dependencies (config in knip.json).
      # After the tests, so a dead-code finding never hides a test result.
      - run: npx --yes knip@6.38.0

  rust:
    # macOS: terminate.rs and its objc2 dependency are built (and tested) only there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          # Same pin as release.yml; upgrade both together.
          toolchain: "1.98.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
      - run: cargo test --manifest-path src-tauri/Cargo.toml
