# ci.yml — type-check and frontend unit tests for every PR and push to main.
# Runs on the runner's preinstalled Node (no container, no setup-node: both
# only added seconds). Rust tests are not run here — release.yml compiles
# the backend on tags.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
