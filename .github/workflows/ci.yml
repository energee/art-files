# ci.yml — frontend and desktop tests, plus dependency audits, on every PR and push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# New PR revisions supersede older test runs; main runs keep their own group.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # poppler's pdftoppm rasterizes the PDF goldens (scripts/golden-diff.mts).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  rust:
    # macOS: terminate.rs and its objc2 dependency are built (and tested) only there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          # Same pin as release.yml; upgrade both together.
          toolchain: "1.98.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    # Fails on known advisories: high/critical in runtime npm deps (--omit=dev skips
    # build and test tooling), and any RustSec vulnerability in src-tauri/Cargo.lock.
    # RustSec warnings (unmaintained/unsound) are printed but do not fail.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
      # Prebuilt, version-pinned cargo-audit (compiling it costs ~5 minutes a run).
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
        working-directory: src-tauri
