# ci.yml — frontend and desktop tests, plus dependency audits, on every PR and push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# New PR revisions supersede older test runs; main runs keep their own group.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Poppler rasterizes PDF goldens; Ghostscript verifies process/spot separations.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils ghostscript
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # The production bundle (vite build) must still build after the tests pass.
      - run: npm run build
      # Dead code: unused files, exports and dependencies (config in knip.json).
      # After the tests, so a dead-code finding never hides a test result.
      - run: npx --yes knip@6.38.0

  rust:
    # macOS: terminate.rs and its objc2 dependency are built (and tested) only there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Same pin as release.yml; upgrade both together.
          toolchain: "1.98.1"
          components: rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./src-tauri -> target
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-cross:
    # The rust job builds on macOS only; this type-checks the Linux and Windows
    # cfg branches (single-instance, argv opens) so they cannot rot unseen.
    name: rust-cross (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Same system packages release.yml installs for the Linux build.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Same pin as the rust job and release.yml; upgrade together.
          toolchain: "1.98.1"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  audit:
    # Fails on known advisories: high/critical in runtime npm deps (--omit=dev skips
    # build and test tooling), and any RustSec vulnerability in src-tauri/Cargo.lock.
    # RustSec warnings (unmaintained/unsound) are printed but do not fail.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
      # Prebuilt, version-pinned cargo-audit (compiling it costs ~5 minutes a run).
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
        working-directory: src-tauri
