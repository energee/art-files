# ci.yml — type-check, lint, and frontend unit tests for every PR and push to main.
# Runs on the runner's preinstalled Node (no container, no setup-node: both
# only added seconds). Rust tests are not run here — release.yml compiles
# the backend on tags.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# New PR revisions supersede older test runs; main runs keep their own group.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # poppler's pdftoppm rasterizes the PDF goldens (scripts/golden-diff.mts).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
