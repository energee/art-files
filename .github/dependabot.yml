# dependabot.yml — weekly dependency PRs, grouped so one PR carries all the
# minor/patch bumps for each ecosystem. Majors arrive one PR each. CI's
# tsc + lint + vitest gate them; a merged bump to package.json still needs
# the release-steward version bump before it ships a binary.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs-site
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
