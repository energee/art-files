[package]
name = "label-lab"
version = "0.1.115"
description = "Desktop label artwork and print plate generator"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Canonicalises opened .label paths without Windows' \\?\ prefix (src/main.rs
# OpenedFile::push). Already in the tree via tauri.
dunce = "1.0.5"
# Not called directly, but tauri::generate_context!() expands to serde_json paths.
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Reveals an exported file in Finder / File Explorer (src/reveal.ts).
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"

# Windows/Linux receive file-association opens as argv on a NEW process;
# single-instance forwards that argv to the running app instead (macOS gets
# Apple events natively, so it does not need the plugin).
[target."cfg(not(target_os = \"macos\"))".dependencies]
tauri-plugin-single-instance = "2"

# macOS: adds applicationShouldTerminate: to tao's app delegate so app-level
# quits run the unsaved-tabs prompt (src/terminate.rs). Already in the tree
# via tao; listed here only to call the Objective-C runtime directly.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
