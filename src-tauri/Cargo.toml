[package]
name = "label-lab"
version = "0.1.28"
description = "Desktop label artwork and print plate generator"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-updater = "2.10.1"

# Windows/Linux receive file-association opens as argv on a NEW process;
# single-instance forwards that argv to the running app instead (macOS gets
# Apple events natively, so it does not need the plugin).
[target."cfg(not(target_os = \"macos\"))".dependencies]
tauri-plugin-single-instance = "2"
