[package]
name = "label-lab"
version = "0.1.121"
description = "Desktop label artwork and print plate generator"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Canonicalises opened .label paths without Windows' \\?\ prefix (src/main.rs
# OpenedFile::push). Already in the tree via tauri.
dunce = "1.0.5"
# Scans the installed fonts for the desktop Font menu (src/system_fonts.rs).
# No memmap/fontconfig: we only need each face's names, weight and file path.
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
# Serializes SystemFont for the list_system_fonts command. Already in the tree via tauri.
serde = { version = "1", features = ["derive"] }
# Not called directly, but tauri::generate_context!() expands to serde_json paths.
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Reveals an exported file in Finder / File Explorer (src/reveal.ts).
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.1"
# Checks an installed font has Latin letters before System Fonts lists it (system_fonts.rs).
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

# Windows/Linux receive file-association opens as argv on a NEW process;
# single-instance forwards that argv to the running app instead (macOS gets
# Apple events natively, so it does not need the plugin).
[target."cfg(not(target_os = \"macos\"))".dependencies]
tauri-plugin-single-instance = "2"

# macOS: adds applicationShouldTerminate: to tao's app delegate so app-level
# quits run the unsaved-tabs prompt (src/terminate.rs). Already in the tree
# via tao; listed here only to call the Objective-C runtime directly.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
