<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c33"/>
      <stop offset="1" stop-color="#16171b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4c6ca"/>
      <stop offset=".45" stop-color="#e2e3e5"/>
      <stop offset="1" stop-color="#d6d6d4"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="597" cy="512" r="165" fill="#000"/>
      <path d="M250 489.5 L442 496 L442 531 L250 542 Z" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- macOS grid: 824px rounded square inset 100px, shadow below -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="512" cy="512" r="250" fill="url(#mark)" mask="url(#cut)"/>
</svg>
